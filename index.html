<script>
const GameData = {
    coins: parseInt(localStorage.getItem('sc_coins') || '60', 10),
    unlocked: JSON.parse(localStorage.getItem('sc_unlocked') || '["blue"]'),
    selected: localStorage.getItem('sc_selected') || 'blue',
    save() {
        localStorage.setItem('sc_coins', this.coins.toString());
        localStorage.setItem('sc_unlocked', JSON.stringify(this.unlocked));
        localStorage.setItem('sc_selected', this.selected);
    }
};

const SUITS = [
    { id: 'blue',   name: 'Офицер',   hex: 0x1e88e5, dark: 0x0d47a1, price: 0 },
    { id: 'red',    name: 'Штурм',    hex: 0xe53935, dark: 0xb71c1c, price: 35 },
    { id: 'yellow', name: 'Инженер',  hex: 0xffb300, dark: 0xff6f00, price: 70 },
    { id: 'pink',   name: 'Медик',    hex: 0xec407a, dark: 0x880e4f, price: 110 },
    { id: 'black',  name: 'Предатель',hex: 0x37474f, dark: 0x102027, price: 180 },
    { id: 'white',  name: 'Капитан',  hex: 0xe0e0e0, dark: 0x757575, price: 240 }
];

class SoundSys {
    constructor() { this.ctx = null; }
    init() {
        if (!this.ctx) {
            const AC = window.AudioContext || window.webkitAudioContext;
            this.ctx = new AC();
        }
        if (this.ctx.state === 'suspended') this.ctx.resume();
    }
    play(type, f1, f2, dur, vol = 0.1, delay = 0) {
        if (!this.ctx) return;
        const t = this.ctx.currentTime + delay;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(f1, t);
        if (f2) osc.frequency.exponentialRampToValueAtTime(f2, t + dur);
        gain.gain.setValueAtTime(vol, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(t);
        osc.stop(t + dur);
    }
    shoot() { this.play('triangle', 600, 150, 0.08, 0.08); }
    hit()   { this.play('sawtooth', 180, 50, 0.06, 0.07); }
    coin()  { this.play('sine', 880, 1400, 0.12, 0.09); }
    up()    { this.play('sine', 400, 900, 0.18, 0.12); }
    hurt()  { this.play('square', 120, 50, 0.15, 0.14); }
    alarm() { this.play('sawtooth', 300, 220, 0.22, 0.1); }
}
const sfx = new SoundSys();

        g.fillRoundedRect(12, 12, 30, 32, 12);
        g.lineStyle(2, 0x0d2810, 1);
        g.strokeRoundedRect(12, 12, 30, 32, 12);
        g.fillStyle(0x111111, 1);
        g.fillRoundedRect(22, 16, 18, 10, 3);
        g.fillStyle(0x76ff03, 1);

class MenuScene extends Phaser.Scene {
    constructor() { super('MenuScene'); }

    create() {
        const { width, height } = this.scale;

        const bg = this.add.graphics();
        bg.fillStyle(0x0b0e14, 1);
        bg.fillRect(0, 0, width, height);
        bg.lineStyle(1, 0x162030, 1);
        for(let x=0; x<width; x+=50) { bg.moveTo(x,0); bg.lineTo(x,height); }
        for(let y=0; y<height; y+=50) { bg.moveTo(0,y); bg.lineTo(width,y); }
        bg.strokePath();

        const cBg = this.add.graphics();
        cBg.fillStyle(0x000000, 0.7);
        cBg.fillRoundedRect(width - 145, 14, 125, 34, 8);
        this.add.image(width - 124, 31, 'coin').setScale(0.8);
        this.coinTxt = this.add.text(width - 106, 31, GameData.coins.toString(), {
            fontSize: '16px', fontWeight: 'bold', color: '#ffd700', fontFamily: 'Roboto, sans-serif'
        }).setOrigin(0, 0.5);

        this.add.text(width / 2, height * 0.12, 'SPACE CREW: ZOMBIE OUTBREAK', {
            fontSize: Math.min(width * 0.035, 24) + 'px',
            fontWeight: '900', color: '#ffffff', stroke: '#00b0ff', strokeThickness: 4,
            fontFamily: 'Roboto, sans-serif'
        }).setOrigin(0.5);

        this.preview = this.add.image(width * 0.20, height * 0.52, 'crew_' + GameData.selected).setScale(1.8);
        this.tweens.add({ targets: this.preview, y: height * 0.52 - 6, duration: 1000, yoyo: true, repeat: -1 });
        this.suitLabel = this.add.text(width * 0.20, height * 0.72, '', { fontSize: '12px', fontWeight: 'bold', color: '#00e5ff', fontFamily: 'Roboto, sans-serif' }).setOrigin(0.5);

        this.add.text(width * 0.58, height * 0.22, 'ВЫБЕРИТЕ КОСТЮМ:', { fontSize: '12px', fontWeight: 'bold', color: '#90a4ae', fontFamily: 'Roboto, sans-serif' }).setOrigin(0.5);

        this.cards = [];
        const cols = 2, w = 135, h = 46;
        const startX = width * 0.58 - ((cols - 1) * (w + 10)) / 2;
        const startY = height * 0.34;

        SUITS.forEach((s, idx) => {
            const col = idx % cols, row = Math.floor(idx / cols);
            const cx = startX + col * (w + 10), cy = startY + row * (h + 8);

            const cont = this.add.container(cx, cy);
            const box = this.add.graphics();
            const icon = this.add.image(-44, 0, 'crew_' + s.id).setScale(0.5);
            const name = this.add.text(10, -8, s.name, { fontSize: '11px', fontWeight: 'bold', color: '#fff', fontFamily: 'Roboto, sans-serif' }).setOrigin(0, 0.5);
            const status = this.add.text(10, 8, '', { fontSize: '10px', fontWeight: 'bold', color: '#ffd700', fontFamily: 'Roboto, sans-serif' }).setOrigin(0, 0.5);

            cont.add([box, icon, name, status]);
            cont.setSize(w, h);
            cont.setInteractive({ useHandCursor: true });

            cont.on('pointerdown', () => {
                sfx.init();
                this.selectOrBuy(s);
            });

            this.cards.push({ s, box, status, w, h });
        });

        this.updateShop();

        const btnW = 190, btnH = 46;
        const playBtn = this.add.container(width * 0.58, height * 0.82);
        const pBg = this.add.graphics();
        pBg.fillStyle(0x00c853, 1);
        pBg.fillRoundedRect(-btnW/2, -btnH/2, btnW, btnH, 8);
        pBg.lineStyle(2, 0xb9f6ca, 1);
        pBg.strokeRoundedRect(-btnW/2, -btnH/2, btnW, btnH, 8);
        const pTxt = this.add.text(0, 0, 'ИГРАТЬ', { fontSize: '18px', fontWeight: '900', color: '#fff', fontFamily: 'Roboto, sans-serif' }).setOrigin(0.5);

        playBtn.add([pBg, pTxt]);
        playBtn.setSize(btnW, btnH);
        playBtn.setInteractive({ useHandCursor: true });

        playBtn.on('pointerdown', () => {
            sfx.init();
            sfx.up();
            this.scene.start('RoleRevealScene');
        });
    }

    selectOrBuy(s) {
        if (GameData.unlocked.includes(s.id)) {
            GameData.selected = s.id;
            GameData.save();
            sfx.coin();
            this.updateShop();
        } else if (GameData.coins >= s.price) {
            GameData.coins -= s.price;
            GameData.unlocked.push(s.id);
            GameData.selected = s.id;
            GameData.save();
            sfx.up();
            this.updateShop();
        } else {
            sfx.hurt();
        }
    }

    updateShop() {
        this.coinTxt.setText(GameData.coins.toString());
        this.preview.setTexture('crew_' + GameData.selected);
        const cur = SUITS.find(s => s.id === GameData.selected);
        this.suitLabel.setText(`Костюм: ${cur ? cur.name : ''}`);

        this.cards.forEach(c => {
            const unlocked = GameData.unlocked.includes(c.s.id);
            const selected = GameData.selected === c.s.id;

            c.box.clear();
            c.box.fillStyle(selected ? 0x1565c0 : 0x131a26, 0.95);
            c.box.fillRoundedRect(-c.w/2, -c.h/2, c.w, c.h, 7);
            c.box.lineStyle(2, selected ? 0x00e5ff : (unlocked ? 0x4caf50 : 0x37474f), 1);
            c.box.strokeRoundedRect(-c.w/2, -c.h/2, c.w, c.h, 7);

            if (selected) c.status.setText('ВЫБРАН').setColor('#00e5ff');
            else if (unlocked) c.status.setText('НАДЕТЬ').setColor('#69f0ae');
            else c.status.setText(`${c.s.price} 💰`).setColor(GameData.coins >= c.s.price ? '#ffd700' : '#78909c');
        });
    }
}

class RoleRevealScene extends Phaser.Scene {
    constructor() { super('RoleRevealScene'); }
    create() {
        const { width, height } = this.scale;
        this.add.graphics().fillStyle(0x05070a, 1).fillRect(0, 0, width, height);

        const glow = this.add.circle(width / 2, height * 0.52, 90, 0xff0000, 0.15);
        this.tweens.add({ targets: glow, scale: 1.2, alpha: 0.25, duration: 800, yoyo: true, repeat: -1 });

        this.add.text(width / 2, height * 0.22, 'ZOMBIE', {
            fontSize: Math.min(width * 0.08, 46) + 'px',
            fontWeight: '900',
            color: '#00e676',
            stroke: '#003300',
            strokeThickness: 6,
            fontFamily: 'Roboto, sans-serif'
        }).setOrigin(0.5);

        this.add.image(width / 2, height * 0.52, 'crew_' + GameData.selected).setScale(2.4);
        this.add.image(width / 2 + 24, height * 0.55, 'weapon').setScale(1.6);

        let sec = 3;
        const sub = this.add.text(width / 2, height * 0.82, `Zombies incoming! ${sec}s`, {
            fontSize: '16px',
            fontWeight: 'bold',
            color: '#ffffff',
            fontFamily: 'Roboto, sans-serif'
        }).setOrigin(0.5);

        sfx.alarm();

        const timer = this.time.addEvent({
            delay: 1000,
            callback: () => {
                sec--;
                if (sec > 0) {
                    sub.setText(`Zombies incoming! ${sec}s`);
                    sfx.alarm();
                } else {
                    timer.remove();
                    this.scene.start('GameScene');
                }
            },
            loop: true
        });

        this.input.once('pointerdown', () => {
            timer.remove();
            this.scene.start('GameScene');
        });
    }
}

class GameScene extends Phaser.Scene {
    constructor() { super('GameScene'); }

    init() {
        this.mapW = 2000;
        this.mapH = 1400;
        this.stats = { maxHp: 100, hp: 100, speed: 290, damage: 25, fireRate: 460, multi: 1, sessionCoins: 0 };
        this.upgrades = {
            damage: { lvl: 1, cost: 20, name: 'Урон' },
            fire: { lvl: 1, cost: 25, name: 'Темп' },
            multi: { lvl: 1, cost: 55, name: 'Пули x1' },
            speed: { lvl: 1, cost: 20, name: 'Скорость' },
            hp: { lvl: 1, cost: 20, name: 'Броня' }
        };
        this.wave = 1;
        this.maxWaves = 8;
        this.toSpawn = 0;
        this.alive = 0;
        this.isOver = false;
        this.lastFired = 0;
        this.lastHurt = 0;
        this.joyVec = new Phaser.Math.Vector2(0, 0);
        this.joyId = null;
    }

    create() {
        this.physics.world.setBounds(40, 40, this.mapW - 80, this.mapH - 80);
        this.drawStorageDeck();

        this.bullets = this.physics.add.group({ maxSize: 150 });
        this.bossShots = this.physics.add.group({ maxSize: 60 });
        this.enemies = this.physics.add.group();
        this.items = this.physics.add.group();

        this.player = this.physics.add.sprite(this.mapW / 2, this.mapH / 2, 'crew_' + GameData.selected);
        this.player.setCollideWorldBounds(true);
        this.player.setCircle(18, 10, 15);
        this.player.setDepth(10);

        this.gun = this.add.image(this.player.x, this.player.y, 'weapon').setDepth(11);

        this.cameras.main.setBounds(0, 0, this.mapW, this.mapH);
        this.cameras.main.startFollow(this.player, true, 0.1, 0.1);

        this.cursors = this.input.keyboard.createCursorKeys();
        this.wasd = this.input.keyboard.addKeys({
            up: Phaser.Input.Keyboard.KeyCodes.W,
            down: Phaser.Input.Keyboard.KeyCodes.S,
            left: Phaser.Input.Keyboard.KeyCodes.A,
            right: Phaser.Input.Keyboard.KeyCodes.D
        });

        this.physics.add.overlap(this.bullets, this.enemies, this.onBulletHit, null, this);
        this.physics.add.overlap(this.player, this.enemies, this.onPlayerHit, null, this);
        this.physics.add.overlap(this.player, this.bossShots, this.onBossShotHit, null, this);
        this.physics.add.overlap(this.player, this.items, this.onPickup, null, this);
        this.physics.add.collider(this.enemies, this.enemies);

        this.buildHUD();
        this.buildJoystick();
        this.startWave(this.wave);
    }

    drawStorageDeck() {
        const g = this.add.graphics();
        g.fillStyle(0x111620, 1);
        g.fillRect(0, 0, this.mapW, this.mapH);

        g.lineStyle(2, 0x1b2332, 1);
        for (let x = 0; x <= this.mapW; x += 100) { g.moveTo(x, 0); g.lineTo(x, this.mapH); }
        for (let y = 0; y <= this.mapH; y += 100) { g.moveTo(0, y); g.lineTo(this.mapW, y); }
        g.strokePath();

        const drawCrate = (cx, cy) => {
            g.fillStyle(0x1b382b, 1);
            g.fillRect(cx - 40, cy - 40, 80, 80);
            g.lineStyle(3, 0x2e7d32, 1);
            g.strokeRect(cx - 40, cy - 40, 80, 80);
            g.fillStyle(0x4caf50, 1);
            g.fillRect(cx - 36, cy - 36, 12, 12);
            g.fillRect(cx + 24, cy - 36, 12, 12);
            g.fillRect(cx - 36, cy + 24, 12, 12);
            g.fillRect(cx + 24, cy + 24, 12, 12);
            g.lineStyle(2, 0x11261c, 1);
            g.beginPath();
            g.moveTo(cx - 28, cy - 28); g.lineTo(cx + 28, cy + 28);
            g.moveTo(cx + 28, cy - 28); g.lineTo(cx - 28, cy + 28);
            g.strokePath();
        };

        drawCrate(400, 350);
        drawCrate(1600, 350);
        drawCrate(400, 1050);
        drawCrate(1600, 1050);
        drawCrate(1000, 700);

        g.lineStyle(22, 0x1a2332, 1);
        g.strokeRect(20, 20, this.mapW - 40, this.mapH - 40);
        g.lineStyle(5, 0xffb300, 0.8);
        g.strokeRect(34, 34, this.mapW - 68, this.mapH - 68);
    }

    buildHUD() {
        const { width, height } = this.scale;
        this.hud = this.add.container(0, 0).setScrollFactor(0).setDepth(100);

        const hpBg = this.add.graphics();
        hpBg.fillStyle(0x000000, 0.8);
        hpBg.fillRoundedRect(16, 16, 200, 24, 6);
        this.hpFill = this.add.graphics();
        this.hpTxt = this.add.text(116, 28, '100 / 100', { fontSize: '12px', fontWeight: 'bold', color: '#fff', fontFamily: 'Roboto, sans-serif' }).setOrigin(0.5);

        const cBg = this.add.graphics();
        cBg.fillStyle(0x000000, 0.8);
        cBg.fillRoundedRect(16, 46, 120, 26, 6);
        this.add.image(32, 59, 'coin').setScale(0.75);
        this.coinTxt = this.add.text(48, 59, '0', { fontSize: '15px', fontWeight: 'bold', color: '#ffd700', fontFamily: 'Roboto, sans-serif' }).setOrigin(0, 0.5);

        this.waveTxt = this.add.text(width - 18, 20, 'ВОЛНА 1 / 8', { fontSize: '18px', fontWeight: '900', color: '#fff', stroke: '#000', strokeThickness: 4, fontFamily: 'Roboto, sans-serif' }).setOrigin(1, 0);

        this.banner = this.add.text(width / 2, height * 0.22, '', { fontSize: '28px', fontWeight: '900', color: '#ffeb3b', stroke: '#000', strokeThickness: 6, fontFamily: 'Roboto, sans-serif' }).setOrigin(0.5).setAlpha(0);

        this.hud.add([hpBg, this.hpFill, this.hpTxt, cBg, this.coinTxt, this.waveTxt, this.banner]);

        this.buildUpgrades();
        this.refreshHUD();
    }

    buildUpgrades() {
        const { width, height } = this.scale;
        const keys = ['damage', 'fire', 'multi', 'speed', 'hp'];
        const colors = [0xe53935, 0xfb8c00, 0x8e24aa, 0x1e88e5, 0x43a047]; 
        const cols = keys.length;
        const bw = Math.min(115, Math.floor((width - 40 - (cols - 1) * 6) / cols));
        const bh = 44;
        const totalW = cols * bw + (cols - 1) * 6;
        const startX = (width - totalW) / 2 + bw / 2;
        const posY = height - bh / 2 - 8;

        this.upBtns = {};
        keys.forEach((k, i) => {
            const x = startX + i * (bw + 6);
            const cont = this.add.container(x, posY).setScrollFactor(0).setDepth(101);
            const b
